name: Upload to Cloudflare R2

on:
  push:
    branches:
      - main

jobs:
  upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install Wrangler CLI
        run: npm install -g wrangler

      - name: Upload files to R2
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          R2_BUCKET: "autorag-data"
        run: |
          # Upload all files except .git
          for file in $(find . -type f -not -path "./.git/*"); do
            # Remove leading ./ from file path
            key=$(echo "$file" | sed 's|^\./||')
            echo "Uploading $file as $key..."
            wrangler r2 object put $R2_BUCKET/$key --file "$file"
          done
